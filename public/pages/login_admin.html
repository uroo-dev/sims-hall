<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrator - SMK NEGERI 2 KARANGANYAR</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Subtle floating animation for badge and icons */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(2deg);
            }
        }

        @keyframes waveMove {
            0% {
                transform: translateX(0) translateZ(0) scaleY(1);
            }
            50% {
                transform: translateX(-25px) translateZ(0) scaleY(1.05);
            }
            100% {
                transform: translateX(0) translateZ(0) scaleY(1);
            }
        }

        .animate-float {
            animation: float 5s ease-in-out infinite;
        }

        .animate-wave-slow {
            animation: waveMove 8s ease-in-out infinite;
        }

        .animate-wave-fast {
            animation: waveMove 5s ease-in-out infinite;
        }

        /* Grid dot pattern background */
        .bg-grid-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.25) 1.5px, transparent 1.5px);
            background-size: 16px 16px;
        }

        /* School watermark silhouette simulation */
        .school-watermark {
            background-image: linear-gradient(to bottom, rgba(2, 90, 180, 0.85), rgba(1, 65, 135, 0.95)),
                url('https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }

        /* Curved transition divider */
        .wave-divider {
            filter: drop-shadow(6px 0px 10px rgba(0, 0, 0, 0.12));
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 md:p-10 select-none">

    <!-- Main Card Container -->
    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[600px] relative">

        <!-- ================= LEFT PANEL (BLUE BANNER) ================= -->
        <div class="relative w-full md:w-1/2 school-watermark text-white flex flex-col justify-between p-8 sm:p-12 overflow-hidden min-h-[380px] md:min-h-full">

            <!-- Pattern Dots (Pojok Kiri Atas & Kanan Bawah) -->
            <div class="absolute top-6 left-6 w-24 h-24 bg-grid-pattern opacity-70 pointer-events-none"></div>
            <div class="absolute bottom-6 left-6 w-20 h-20 bg-grid-pattern opacity-70 pointer-events-none"></div>

            <!-- Welcome Text Content (Administrator) -->
            <div class="relative z-10 space-y-3 mt-2 sm:mt-4">
                <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight leading-tight drop-shadow-md">
                    Selamat Datang,<br />Administrator
                </h1>
                <p class="text-blue-100 text-xs sm:text-sm font-light max-w-xs leading-relaxed drop-shadow">
                    Kelola portal akademik dengan mudah, cepat, dan aman.
                </p>
            </div>

            <!-- Floating Central Dashboard / Admin Graphic Badge -->
            <div class="relative z-10 flex justify-center items-center my-8 md:my-auto">
                <div class="animate-float relative flex items-center justify-center">
                    <!-- Ring Berputar -->
                    <div class="absolute inset-0 rounded-full border-2 border-dashed border-white/40 w-32 h-32 -m-3 animate-spin-slow" style="animation-duration: 25s;"></div>
                    
                    <!-- Icon Card Dashboard + Gear -->
                    <div class="w-28 h-28 rounded-2xl bg-sky-600/70 border-2 border-white/80 backdrop-blur-md flex flex-col items-center justify-center shadow-xl transition-transform hover:scale-105 duration-300 relative">
                        <i class="fa-solid fa-chart-column text-3xl text-white drop-shadow mb-1"></i>
                        <div class="flex gap-1">
                            <span class="w-4 h-1 bg-white/80 rounded-full"></span>
                            <span class="w-2 h-1 bg-white/80 rounded-full"></span>
                        </div>
                        <!-- Floating Gear Ornament -->
                        <div class="absolute -bottom-2 -right-2 bg-blue-500 text-white p-1.5 rounded-full border border-white shadow-md">
                            <i class="fa-solid fa-gear text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Decorative Floating Rings -->
            <div class="absolute top-1/3 right-10 w-8 h-8 border-2 border-white/20 rounded-full pointer-events-none animate-float" style="animation-delay: 1s;"></div>
            <div class="absolute bottom-1/4 left-1/3 w-5 h-5 border border-white/30 rounded-full pointer-events-none animate-float" style="animation-delay: 2s;"></div>

            <!-- Bottom Dynamic Wave SVGs -->
            <div class="absolute inset-x-0 bottom-0 pointer-events-none overflow-hidden leading-none z-0">
                <svg class="relative block w-full h-20 text-blue-400/30 animate-wave-slow" viewBox="0 0 1200 120" preserveAspectRatio="none">
                    <path d="M0,0 C150,90 350,-40 500,50 C650,140 900,10 1200,40 L1200,120 L0,120 Z" fill="currentColor"></path>
                </svg>
                <svg class="absolute bottom-0 left-0 w-full h-16 text-blue-300/20 animate-wave-fast" viewBox="0 0 1200 120" preserveAspectRatio="none">
                    <path d="M0,30 C300,110 500,10 700,70 C900,130 1100,20 1200,50 L1200,120 L0,120 Z" fill="currentColor"></path>
                </svg>
            </div>

            <!-- Curved Edge Transition (Divider Lengkung Sesuai Gambar) -->
            <div class="hidden md:block absolute -right-1 top-0 bottom-0 w-16 pointer-events-none z-20">
                <svg class="h-full w-full text-white wave-divider" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="M0,0 C60,25 60,75 0,100 L100,100 L100,0 Z" fill="currentColor"></path>
                </svg>
            </div>
        </div>

        <!-- ================= RIGHT PANEL (ADMIN LOGIN FORM) ================= -->
        <div class="w-full md:w-1/2 bg-white p-8 sm:p-12 flex flex-col justify-between relative z-10">

            <!-- Aksen Biru Atas Kanan -->
            <div class="absolute top-0 right-0 w-20 h-20 bg-[#0066B2] clip-path-polygon hidden sm:block pointer-events-none" style="clip-path: polygon(100% 0, 0 0, 100% 100%);"></div>

            <!-- Top Header & School Badge -->
            <div class="flex items-center justify-between">
                <!-- Back Button -->
                <a href="index.html" id="backBtn" class="w-10 h-10 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-all duration-200 active:scale-95 shadow-sm" title="Kembali">
                    <i class="fa-solid fa-arrow-left text-base"></i>
                </a>

                <!-- School Logo Header -->
                <div class="flex items-center space-x-3 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100 shadow-sm">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-white shadow-sm overflow-hidden">
                        <img src="assets/logosmkk.png" alt="Logo SMK Negeri 2 Karanganyar" class="w-full h-full object-contain">
                    </div>
                    <div class="text-left">
                        <span class="block text-xs font-bold text-slate-800 tracking-wider">SMK NEGERI 2</span>
                        <span class="block text-[10px] font-semibold text-slate-500 uppercase tracking-widest">KARANGANYAR</span>
                    </div>
                </div>
            </div>

            <!-- Main Form Content -->
            <div class="my-auto py-6 max-w-sm w-full mx-auto">
                
                <!-- Alert Message Box -->
                <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200 flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation text-sm"></i>
                    <span id="alertMessage">Username dan Password harus diisi!</span>
                </div>

                <!-- Admin Panel Title -->
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-extrabold text-[#0066B2] tracking-tight">Admin Panel</h2>
                    <div class="w-20 h-1 bg-[#0066B2] rounded-full mx-auto mt-2 flex items-center justify-center">
                        <div class="w-2 h-2 bg-white rounded-full"></div>
                    </div>
                </div>

                <!-- Form Login -->
                <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">

                    <!-- Username Field -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-800">
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                        <input type="text" id="username" required
                            class="w-full pl-11 pr-4 py-3 bg-white text-slate-800 text-sm rounded-full border-2 border-[#0066B2] focus:border-blue-700 focus:ring-4 focus:ring-blue-100 focus:outline-none transition-all placeholder:text-slate-400 font-medium"
                            placeholder="Masukkan Username">
                    </div>

                    <!-- Password Field -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-800">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input type="password" id="password" required
                            class="w-full pl-11 pr-4 py-3 bg-white text-slate-800 text-sm rounded-full border-2 border-[#0066B2] focus:border-blue-700 focus:ring-4 focus:ring-blue-100 focus:outline-none transition-all placeholder:text-slate-400 font-medium"
                            placeholder="Masukkan Password">
                    </div>

                    <!-- Lihat Password Checkbox -->
                    <div class="flex items-center justify-start pl-2">
                        <label class="inline-flex items-center cursor-pointer group">
                            <input type="checkbox" id="togglePassword" onchange="togglePasswordVisibility()"
                                class="rounded border-slate-300 text-[#0066B2] focus:ring-[#0066B2] w-4 h-4 cursor-pointer transition">
                            <span class="ml-2 text-xs text-slate-500 font-medium group-hover:text-slate-700 transition">Lihat Password</span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitBtn"
                        class="w-full py-3 px-6 rounded-full bg-[#0066B2] hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center space-x-2">
                        <span>Login</span>
                        <i id="btnSpinner" class="fa-solid fa-circle-notch fa-spin hidden text-sm"></i>
                    </button>
                </form>

                <!-- Divider Diamond Decorative -->
                <div class="relative my-8 flex items-center justify-center">
                    <div class="w-full border-t border-slate-200"></div>
                    <div class="absolute bg-white px-2">
                        <div class="w-2 h-2 bg-[#0066B2] rotate-45"></div>
                    </div>
                </div>

                <!-- Footer Text -->
                <div class="text-center text-[11px] text-slate-400 font-light">
                    &copy; <span id="year"></span> Portal Akademik SMKN 2 Karanganyar
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set dynamic current year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Toggle Password Visibility Function
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleCheckbox = document.getElementById('togglePassword');

            if (toggleCheckbox.checked) {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        // Handle Login Submission
        function handleLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const alertBox = document.getElementById('alertBox');
            const alertMessage = document.getElementById('alertMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');

            // Hide previous alerts
            alertBox.classList.add('hidden');

            if (!usernameInput.value.trim() || !passwordInput.value.trim()) {
                alertMessage.textContent = 'Username dan Password harus diisi!';
                alertBox.classList.remove('hidden');
                return;
            }

            // Simulate loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            btnSpinner.classList.remove('hidden');

            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                btnSpinner.classList.add('hidden');

                // Success simulation message
                alertBox.className = 'mb-4 p-3 rounded-xl text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-2 animate-fade-in';
                alertMessage.textContent = `Selamat Datang Admin, ${usernameInput.value}! Mengalihkan ke Dashboard Admin...`;
                alertBox.classList.remove('hidden');

                // Clear input after success simulation
                setTimeout(() => {
                    usernameInput.value = '';
                    passwordInput.value = '';
                    document.getElementById('togglePassword').checked = false;
                    passwordInput.type = 'password';
                }, 2000);

            }, 1200);
        }
    </script>
</body>

</html>
