<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SMKN 2 Karanganyar - Login & Daftar</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Subtle floating & pulse animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.08); }
        }

        @keyframes waveMove {
            0% { transform: translateX(0) translateZ(0) scaleY(1); }
            50% { transform: translateX(-25px) translateZ(0) scaleY(1.05); }
            100% { transform: translateX(0) translateZ(0) scaleY(1); }
        }

        .animate-float {
            animation: float 5s ease-in-out infinite;
        }

        .animate-pulse-glow {
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .animate-wave-slow {
            animation: waveMove 8s ease-in-out infinite;
        }

        .animate-wave-fast {
            animation: waveMove 5s ease-in-out infinite;
        }

        /* Grid dot and plus patterns */
        .bg-grid-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.25) 1.5px, transparent 1.5px);
            background-size: 16px 16px;
        }

        /* Plus/Cross grid pattern overlay simulation */
        .bg-plus-pattern {
            background-image: radial-gradient(#0284c7 1px, transparent 1px);
            background-size: 10px 10px;
        }

        /* School watermark silhouette simulation background */
        .school-watermark {
            background-image: linear-gradient(to bottom, rgba(2, 106, 196, 0.85), rgba(1, 55, 115, 0.95)),
                              url('https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }

        /* Custom scrollbar for clean internal scrolling on smaller screens */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* Card flip / slide transition wrapper */
        .view-transition {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-6 md:p-10 select-none">

    <!-- Main Card Container -->
    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden min-h-[640px] relative transition-all duration-300">

        <!-- ALERT NOTIFICATION BOX (Global) -->
        <div id="alertBox" class="hidden fixed top-5 right-5 z-50 max-w-md p-4 rounded-2xl text-xs font-medium shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-0">
            <i id="alertIcon" class="fa-solid fa-circle-info text-base"></i>
            <span id="alertMessage">Notification text here...</span>
            <button onclick="hideAlert()" class="ml-auto text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- ========================================================================= -->
        <!-- VIEW 1: DAFTAR (REGISTRATION PAGE)                                        -->
        <!-- ========================================================================= -->
        <div id="viewDaftar" class="view-transition w-full min-h-[640px] flex flex-col md:flex-row relative">
            
            <!-- LEFT PANEL: REGISTRATION FORM SECTION -->
            <div class="w-full md:w-1/2 bg-white p-6 sm:p-10 flex flex-col justify-between relative z-10 custom-scrollbar max-h-[90vh] md:max-h-none overflow-y-auto">
                
                <!-- Geometric Blue Accent Badge Top Left -->
                <div class="absolute -top-6 -left-6 w-20 h-20 bg-sky-600 transform rotate-45 pointer-events-none rounded-lg shadow-md"></div>
                
                <!-- Top Navigation & Back Arrow -->
                <div class="flex items-center justify-between relative z-20 mb-4">
                    <a href="login.html" type="button" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-all duration-200 active:scale-95 shadow-sm" title="Kembali ke Login">
                        <i class="fa-solid fa-arrow-left text-base"></i>
                    </a>

                    <!-- School Small Emblem Header -->
                    <div class="flex items-center space-x-2.5 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100 shadow-sm">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-white shadow-sm overflow-hidden">
                            <img src="assets/logosmkk.png" alt="Logo SMK Negeri 2 Karanganyar" class="w-full h-full object-contain">
                        </div>
                        <div class="text-left">
                            <span class="block text-[11px] font-bold text-slate-800 tracking-wider">SMK NEGERI 2</span>
                            <span class="block text-[9px] font-semibold text-slate-500 uppercase tracking-widest">KARANGANYAR</span>
                        </div>
                    </div>
                </div>

                <!-- Main Form Section -->
                <div class="my-auto py-2 max-w-sm w-full mx-auto relative z-20">
                    
                    <!-- Header Title -->
                    <div class="text-center mb-5">
                        <h2 class="text-3xl font-extrabold text-sky-600 tracking-tight">Daftar</h2>
                        <div class="w-12 h-1 bg-sky-600 rounded-full mx-auto mt-1.5"></div>
                        <p class="text-[11px] text-slate-500 font-medium mt-2 leading-tight px-2">
                            Buat akun baru untuk mengakses peminjaman aula SMKN 2 Karanganyar
                        </p>
                    </div>

                    <!-- Form -->
                    <form id="daftarForm" class="space-y-3.5" onsubmit="handleDaftarSubmit(event)">
                        
                        <!-- 1. Username Input -->
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-700">
                                <i class="fa-solid fa-user text-xs"></i>
                            </div>
                            <input type="text" id="regUsername" required
                                class="w-full pl-10 pr-4 py-2.5 bg-white text-slate-800 text-xs rounded-full border-2 border-sky-500 focus:border-sky-600 focus:ring-4 focus:ring-sky-100 focus:outline-none transition-all placeholder:text-slate-400 font-medium"
                                placeholder="Masukkan Username">
                        </div>

                        <!-- 2. Instansi / Organisasi Dropdown -->
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-700">
                                <i class="fa-solid fa-building text-xs"></i>
                            </div>
                            <select id="regInstansiType" required
                                class="w-full pl-10 pr-10 py-2.5 bg-white text-slate-700 text-xs rounded-full border-2 border-sky-500 focus:border-sky-600 focus:ring-4 focus:ring-sky-100 focus:outline-none transition-all font-medium appearance-none cursor-pointer">
                                <option value="" disabled selected class="text-slate-400">Pilih Instansi / Organisasi</option>
                                <option value="Internal Sekolah">Internal Sekolah (OSIS / Ekstrakurikuler)</option>
                                <option value="Kedinasan / Pemerintah">Kedinasan / Instansi Pemerintah</option>
                                <option value="Organisasi Masyarakat">Organisasi Masyarakat / Umum</option>
                                <option value="Swasta / Perusahaan">Swasta / Perusahaan</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-sky-600">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>

                        <!-- 3. Nama Instansi Input -->
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-700">
                                <i class="fa-solid fa-address-card text-xs"></i>
                            </div>
                            <input type="text" id="regNamaInstansi" required
                                class="w-full pl-10 pr-4 py-2.5 bg-white text-slate-800 text-xs rounded-full border-2 border-sky-500 focus:border-sky-600 focus:ring-4 focus:ring-sky-100 focus:outline-none transition-all placeholder:text-slate-400 font-medium"
                                placeholder="Nama Instansi">
                        </div>

                        <!-- 4. Alamat Instansi Input -->
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-700">
                                <i class="fa-solid fa-house text-xs"></i>
                            </div>
                            <input type="text" id="regAlamatInstansi" required
                                class="w-full pl-10 pr-4 py-2.5 bg-white text-slate-800 text-xs rounded-full border-2 border-sky-500 focus:border-sky-600 focus:ring-4 focus:ring-sky-100 focus:outline-none transition-all placeholder:text-slate-400 font-medium"
                                placeholder="Alamat Instansi">
                        </div>

                        <!-- 5. Email Instansi Input -->
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-700">
                                <i class="fa-solid fa-at text-xs"></i>
                            </div>
                            <input type="email" id="regEmail" required
                                class="w-full pl-10 pr-4 py-2.5 bg-white text-slate-800 text-xs rounded-full border-2 border-sky-500 focus:border-sky-600 focus:ring-4 focus:ring-sky-100 focus:outline-none transition-all placeholder:text-slate-400 font-medium"
                                placeholder="Email Intansi">
                        </div>

                        <!-- 6. Password Input -->
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-700">
                                <i class="fa-solid fa-lock text-xs"></i>
                            </div>
                            <input type="password" id="regPassword" required
                                class="w-full pl-10 pr-4 py-2.5 bg-white text-slate-800 text-xs rounded-full border-2 border-sky-500 focus:border-sky-600 focus:ring-4 focus:ring-sky-100 focus:outline-none transition-all placeholder:text-slate-400 font-medium"
                                placeholder="Masukkan Password">
                        </div>

                        <!-- Password Visibility Toggle -->
                        <div class="flex items-center justify-start pl-2 pt-0.5">
                            <label class="inline-flex items-center cursor-pointer group">
                                <input type="checkbox" id="regTogglePassword" onchange="toggleRegPassword()" class="rounded border-slate-300 text-sky-600 focus:ring-sky-500 w-3.5 h-3.5 cursor-pointer transition">
                                <span class="ml-2 text-[11px] text-slate-500 font-medium group-hover:text-slate-700 transition">Lihat Password</span>
                            </label>
                        </div>

                        <!-- Registration Submit Button -->
                        <button type="submit" id="btnSubmitDaftar"
                            class="w-full py-3 px-6 rounded-full bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white font-semibold text-xs shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center space-x-2 mt-2">
                            <span>Daftar</span>
                            <i id="spinnerDaftar" class="fa-solid fa-circle-notch fa-spin hidden text-xs"></i>
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="relative my-4 flex items-center justify-center">
                        <div class="w-full border-t border-slate-200"></div>
                        <div class="absolute bg-white px-3 text-[10px] font-semibold text-slate-400 uppercase tracking-widest">
                            atau
                        </div>
                    </div>

                    <!-- Already have account footer -->
                    <div class="text-center">
                        <p class="text-xs text-slate-500 font-medium">
                            Sudah memiliki akun? 
                            <a href="login.html" type="button"  class="text-sky-600 font-bold hover:underline hover:text-sky-800 transition">
                                Login Sekarang
                            </a>
                        </p>
                    </div>
                </div>

                <!-- Bottom Left Corner Plus Pattern Decoration -->
                <div class="absolute bottom-3 left-3 w-16 h-16 bg-plus-pattern opacity-40 pointer-events-none"></div>

                <!-- Footer copyright -->
                <div class="text-center text-[10px] text-slate-400 font-light mt-2">
                    &copy; <span class="yearVal"></span> Portal Peminjaman Aula SMKN 2 Karanganyar
                </div>
            </div>

            <!-- RIGHT PANEL: DEEP BLUE WAVE & BADGE BACKGROUND SECTION -->
            <div class="relative w-full md:w-1/2 school-watermark text-white flex flex-col justify-between p-8 sm:p-12 overflow-hidden min-h-[380px] md:min-h-full">
                
                <!-- Floating Decorative Dots Overlay Top Right -->
                <div class="absolute top-6 right-6 w-24 h-24 bg-grid-pattern opacity-60 pointer-events-none"></div>
                
                <!-- Glowing Floating circles -->
                <div class="absolute top-1/4 right-1/4 w-12 h-12 border-2 border-white/20 rounded-full pointer-events-none animate-float" style="animation-delay: 0.5s;"></div>
                <div class="absolute bottom-1/3 right-10 w-8 h-8 border border-white/30 rounded-full pointer-events-none animate-float" style="animation-delay: 2.2s;"></div>
                <div class="absolute top-1/2 left-10 w-6 h-6 border border-white/25 rounded-full pointer-events-none animate-float" style="animation-delay: 1.5s;"></div>

                <!-- Center Animated Notepad/Pen Badge -->
                <div class="my-auto relative z-10 flex flex-col items-center justify-center text-center py-10">
                    <div class="animate-float relative flex items-center justify-center">
                        <!-- Dashed rotating outer ring -->
                        <div class="absolute inset-0 rounded-full border-2 border-dashed border-white/50 w-28 h-28 -m-2 animate-spin" style="animation-duration: 30s;"></div>
                        <!-- Inner glowing circular emblem -->
                        <div class="w-24 h-24 rounded-full bg-sky-600/70 border-2 border-white/70 backdrop-blur-md flex items-center justify-center shadow-2xl transition-transform hover:scale-110 duration-300 group cursor-pointer">
                            <i class="fa-solid fa-file-signature text-3xl text-white drop-shadow transform group-hover:rotate-6 transition duration-300"></i>
                        </div>
                    </div>
                    <span class="mt-6 text-xs tracking-wider uppercase font-light text-sky-100 bg-white/10 px-4 py-1.5 rounded-full border border-white/20 backdrop-blur-sm">
                        Pendaftaran Online Aula
                    </span>
                </div>

                <!-- Bottom Curved Dynamic Waves -->
                <div class="absolute inset-x-0 bottom-0 pointer-events-none overflow-hidden leading-none z-0">
                    <svg class="relative block w-full h-24 text-sky-500/30 animate-wave-slow" viewBox="0 0 1200 120" preserveAspectRatio="none">
                        <path d="M0,0 C150,90 350,-40 500,50 C650,140 900,10 1200,40 L1200,120 L0,120 Z" fill="currentColor"></path>
                    </svg>
                    <svg class="absolute bottom-0 left-0 w-full h-16 text-sky-400/20 animate-wave-fast" viewBox="0 0 1200 120" preserveAspectRatio="none">
                        <path d="M0,30 C300,110 500,10 700,70 C900,130 1100,20 1200,50 L1200,120 L0,120 Z" fill="currentColor"></path>
                    </svg>
                </div>

                <!-- Left Curved Edge Transition Mask (Smooth White Wave Separator) -->
                <div class="hidden md:block absolute -left-1 top-0 bottom-0 w-16 pointer-events-none z-20 transform rotate-180">
                    <svg class="h-full w-full text-white wave-divider" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <path d="M0,0 C60,25 60,75 0,100 L100,100 L100,0 Z" fill="currentColor"></path>
                    </svg>
                </div>
            </div>
        </div>

    

    </div>

    <script>
        // Set dynamic current year on load
        document.querySelectorAll('.yearVal').forEach(el => {
            el.textContent = new Date().getFullYear();
        });

        // Toggle Password Visibilities
        function toggleRegPassword() {
            const pwd = document.getElementById('regPassword');
            const chk = document.getElementById('regTogglePassword');
            pwd.type = chk.checked ? 'text' : 'password';
        }

        function toggleLoginPassword() {
            const pwd = document.getElementById('loginPassword');
            const chk = document.getElementById('loginTogglePassword');
            pwd.type = chk.checked ? 'text' : 'password';
        }

        // View Switcher logic (Daftar <-> Login)
        function switchToLogin() {
            const vDaftar = document.getElementById('viewDaftar');
            const vLogin = document.getElementById('viewLogin');
            
            vDaftar.classList.add('opacity-0');
            setTimeout(() => {
                vDaftar.classList.add('hidden');
                vLogin.classList.remove('hidden');
                vLogin.classList.remove('opacity-0');
            }, 300);
        }

        function switchToDaftar() {
            const vDaftar = document.getElementById('viewDaftar');
            const vLogin = document.getElementById('viewLogin');

            vLogin.classList.add('opacity-0');
            setTimeout(() => {
                vLogin.classList.add('hidden');
                vDaftar.classList.remove('hidden');
                vDaftar.classList.remove('opacity-0');
            }, 300);
        }

        // Custom Floating Alert Toast System
        function showAlert(msg, type = 'info') {
            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMessage');
            const alertIcon = document.getElementById('alertIcon');

            alertMsg.textContent = msg;

            if (type === 'success') {
                alertBox.className = 'fixed top-5 right-5 z-50 max-w-md p-4 rounded-2xl text-xs font-semibold shadow-2xl flex items-center gap-3 bg-emerald-600 text-white animate-bounce';
                alertIcon.className = 'fa-solid fa-circle-check text-lg';
            } else if (type === 'error') {
                alertBox.className = 'fixed top-5 right-5 z-50 max-w-md p-4 rounded-2xl text-xs font-semibold shadow-2xl flex items-center gap-3 bg-rose-600 text-white animate-bounce';
                alertIcon.className = 'fa-solid fa-triangle-exclamation text-lg';
            } else {
                alertBox.className = 'fixed top-5 right-5 z-50 max-w-md p-4 rounded-2xl text-xs font-semibold shadow-2xl flex items-center gap-3 bg-sky-700 text-white animate-fade-in';
                alertIcon.className = 'fa-solid fa-circle-info text-lg';
            }

            alertBox.classList.remove('hidden');

            setTimeout(() => {
                hideAlert();
            }, 4500);
        }

        function hideAlert() {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.add('hidden');
        }

        // Submit Handler for Registration Form
        function handleDaftarSubmit(e) {
            e.preventDefault();

            const username = document.getElementById('regUsername').value.trim();
            const instansiType = document.getElementById('regInstansiType').value;
            const namaInstansi = document.getElementById('regNamaInstansi').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const btn = document.getElementById('btnSubmitDaftar');
            const spinner = document.getElementById('spinnerDaftar');

            if (!instansiType) {
                showAlert('Silakan pilih jenis Instansi / Organisasi!', 'error');
                return;
            }

            // Simulate loading state
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            spinner.classList.remove('hidden');

            setTimeout(() => {
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                spinner.classList.add('hidden');

                showAlert(`Pendaftaran Akun ${namaInstansi} (${username}) Berhasil! Mengalihkan ke Login...`, 'success');

                // Clear fields and switch to login
                setTimeout(() => {
                    document.getElementById('daftarForm').reset();
                    switchToLogin();
                }, 2200);

            }, 1500);
        }

        // Submit Handler for Login Form
        function handleLoginSubmit(e) {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const btn = document.getElementById('btnLoginSubmit');
            const spinner = document.getElementById('spinnerLogin');

            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            spinner.classList.remove('hidden');

            setTimeout(() => {
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                spinner.classList.add('hidden');

                showAlert(`Selamat datang kembali, ${username}! Selamat beraktivitas.`, 'success');
            }, 1200);
        }
    </script>
</body>
</html>
