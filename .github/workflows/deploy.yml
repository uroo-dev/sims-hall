name: CI/CD Laravel

on:
  push:
    branches:
      - main
      - uroo
  pull_request:
    branches:
      - main
      - uroo
  workflow_dispatch:

# Least privilege: repo ini hanya butuh baca isi repo.
permissions:
  contents: read

# Cegah dua deploy menumpuk di VPS yang sama.
# cancel-in-progress: false -> kalau ada push baru, deploy yang sedang jalan
# dibiarkan selesai supaya tidak setengah-setengah (git switch + migrate).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, pdo_mysql, pdo_sqlite, sqlite3, dom, curl, libxml, fileinfo, zip, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      # Aset yang diuji = aset yang dideploy. Dipindah sebagai artifact supaya
      # deploy job tidak perlu build ulang (dan tidak perlu Node di VPS).
      - name: Upload built assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to VPS
    needs: test
    # Deploy otomatis untuk push ke main / uroo, atau trigger manual workflow_dispatch
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'uroo'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download built assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-build
          path: public/build

      - name: Upload frontend assets to VPS (staging)
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: public/build/*
          target: /tmp/sims-hall-build
          strip_components: 2
          rm: true

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR || '/home/gajagohosting/apps/sims-hall' }}"
            TARGET_BRANCH="${{ github.ref_name }}"

            if [ ! -d "$APP_DIR" ]; then
              echo "FATAL: Direktori aplikasi $APP_DIR tidak ditemukan di VPS." >&2
              exit 1
            fi

            cd "$APP_DIR"
            echo "Deploying branch: $TARGET_BRANCH ke $APP_DIR"

            # Jika file deploy.sh tersedia di VPS, eksekusi file tersebut dengan argumen branch
            if [ -f "$APP_DIR/deploy.sh" ]; then
              echo "Menjalankan deploy.sh..."
              chmod +x "$APP_DIR/deploy.sh"
              export DEPLOY_BRANCH="$TARGET_BRANCH"
              "$APP_DIR/deploy.sh" "$TARGET_BRANCH"
            else
              echo "Menjalankan standard Laravel deployment untuk branch $TARGET_BRANCH..."
              git fetch origin "$TARGET_BRANCH"
              git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH" || git reset --hard "origin/$TARGET_BRANCH"
              composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
              php artisan storage:link || true
              php artisan migrate --force
              php artisan optimize:clear
              php artisan optimize
              php artisan queue:restart || true
            fi

      # Swap aset frontend ke public/build di VPS dan sinkronkan ke web root jika terpisah
      - name: Swap and sync frontend assets into place
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR || '/home/gajagohosting/apps/sims-hall' }}"
            WEB_ROOT="${{ secrets.WEB_ROOT || '/home/gajagohosting/public_html' }}"
            cd "$APP_DIR"

            if [ ! -f /tmp/sims-hall-build/manifest.json ]; then
              echo "FATAL: /tmp/sims-hall-build/manifest.json tidak ada di staging." >&2
              exit 1
            fi

            # Validasi aset file di manifest
            for entry in resources/js/app.js resources/css/app.css; do
              rel=$(php -r '$m=json_decode(file_get_contents("/tmp/sims-hall-build/manifest.json"),true);$k=$argv[1];echo $m[$k]["file"]??"";' "$entry")
              if [ -z "$rel" ] || [ ! -s "/tmp/sims-hall-build/$rel" ]; then
                echo "FATAL: aset untuk $entry hilang atau kosong: '$rel'" >&2
                exit 1
              fi
              echo "OK: $entry -> $rel ($(wc -c < "/tmp/sims-hall-build/$rel") byte)"
            done

            # Swapping direktori secara atomik di APP_DIR/public/build
            mkdir -p public
            rm -rf public/build.prev
            if [ -d public/build ]; then
              mv public/build public/build.prev
            fi
            mv /tmp/sims-hall-build public/build
            rm -rf public/build.prev /tmp/sims-hall-build

            echo "== Aset frontend aktif di $APP_DIR/public/build =="
            ls -la public/build/manifest.json
            ls -la public/build/assets/

            # Sinkronkan ke web root jika direktori web root terpisah dari repo
            if [ -d "$WEB_ROOT" ] && [ "$WEB_ROOT" != "$APP_DIR/public" ]; then
              echo "== Sinkronkan aset ke web root: $WEB_ROOT/build =="
              mkdir -p "$WEB_ROOT"
              if command -v rsync >/dev/null 2>&1; then
                rsync -a --delete public/build/ "$WEB_ROOT/build/"
              else
                rm -rf "$WEB_ROOT/build"
                cp -a public/build "$WEB_ROOT/build"
              fi
              ls -la "$WEB_ROOT/build/manifest.json"
            fi

      - name: Smoke test production
        run: |
          set -euo pipefail
          BASE="${{ secrets.APP_URL || 'https://gajagohosting.my.id' }}"

          echo "Menjalankan smoke test ke $BASE..."
          for path in / /login /registrasi; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE$path")
            echo "$path -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "FATAL: $path mengembalikan HTTP $code setelah deploy" >&2
              exit 1
            fi
          done

          # Validasi manifest dan aset file yang dideploy
          manifest_url="$BASE/build/manifest.json"
          manifest_code=$(curl -s -o /tmp/manifest.json -w '%{http_code}' --max-time 30 "$manifest_url")
          echo "$manifest_url -> HTTP $manifest_code"
          if [ "$manifest_code" != "200" ]; then
            echo "FATAL: $manifest_url tidak ditemukan (HTTP $manifest_code)" >&2
            exit 1
          fi

          for entry in resources/js/app.js resources/css/app.css; do
            rel=$(php -r '$m=json_decode(file_get_contents("/tmp/manifest.json"),true);$k=$argv[1];echo $m[$k]["file"]??"";' "$entry")
            if [ -n "$rel" ]; then
              asset_url="$BASE/build/$rel"
              asset_code=$(curl -s -o /tmp/asset_file -w '%{http_code}' --max-time 30 "$asset_url")
              size=$(wc -c < /tmp/asset_file)
              echo "$asset_url -> HTTP $asset_code ($size bytes)"
              if [ "$asset_code" != "200" ]; then
                echo "FATAL: Aset $asset_url gagal diakses (HTTP $asset_code)" >&2
                exit 1
              fi
              if [ "$size" -eq 0 ]; then
                echo "FATAL: Aset $asset_url berukuran 0 byte" >&2
                exit 1
              fi
            fi
          done

          echo "== Smoke test lolos! Deployment berhasil =="